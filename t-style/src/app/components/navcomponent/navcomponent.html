<div class="ts-topbar text-center py-2">
  <span class="ts-topbar-text">{{ announcement() }}</span>
</div>

<nav class="navbar navbar-expand-lg navbar-dark ts-navbar">
  <div class="container-fluid px-4 px-lg-5">
    <a class="navbar-brand ts-brand font-display" href="#">{{ brand() }}</a>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#tsNav"
      aria-controls="tsNav" aria-expanded="false" aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="tsNav">
      <ul class="navbar-nav mx-auto gap-lg-4">
        @for (link of links(); track link) {
          <li class="nav-item">
            <a class="nav-link ts-link" href="#">{{ link }}</a>
          </li>
        }
      </ul>

      <div class="d-flex gap-2 mt-3 mt-lg-0">
        @for (s of socials(); track s.label) {
          <a href="#" class="ts-circle" [attr.aria-label]="s.label">
            <i class="bi" [class]="s.icon"></i>
          </a>
        }
      </div>
    </div>
  </div>
</nav>
