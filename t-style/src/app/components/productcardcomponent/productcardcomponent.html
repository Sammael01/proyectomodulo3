<article class="card h-100 ts-card">
  <a [routerLink]="['/producto', product().id]" class="ts-media ts-art" [style.--art]="product().swatch" [attr.aria-label]="product().name">
    <i class="bi bi-tag"></i>
    <span class="position-absolute top-0 start-0 m-3 d-flex gap-1">
      @if (product().isNew) {
        <span class="badge text-bg-warning">Nuevo</span>
      }
      @if (product().oldPrice) {
        <span class="badge text-bg-danger">Oferta</span>
      }
    </span>
  </a>
  <div class="card-body d-flex flex-column">
    <small class="ts-cat">{{ product().category }}</small>
    <a [routerLink]="['/producto', product().id]" class="card-title fw-semibold text-decoration-none link-light mb-0">{{ product().name }}</a>
    <div class="d-flex align-items-end justify-content-between gap-2 mt-auto pt-2">
      <div>
        <strong>{{ product().price | money }}</strong>
        @if (product().oldPrice) {
          <s class="d-block small text-body-tertiary">{{ product().oldPrice | money }}</s>
        }
      </div>
      <button type="button" class="btn btn-outline-warning ts-add" [class.animate__animated]="pulse()" [class.animate__rubberBand]="pulse()"
        (click)="quickAdd()" (animationend)="pulse.set(false)" [disabled]="product().stock <= 0"
        [attr.aria-label]="'Agregar ' + product().name + ' al carrito'">
        <i class="bi bi-bag-plus"></i>
      </button>
    </div>
  </div>
</article>
