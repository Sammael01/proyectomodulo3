<div class="toast-container position-fixed bottom-0 end-0 p-4" aria-live="polite">
  @for (t of toast.toasts(); track t.id) {
    <div class="toast show align-items-center animate__animated animate__faster"
      [class.text-bg-danger]="t.kind === 'error'"
      [class.animate__fadeInRight]="!t.leaving" [class.animate__fadeOutRight]="t.leaving" role="status">
      <div class="d-flex">
        <div class="toast-body d-flex align-items-center gap-2">
          <i class="bi" [class]="t.kind === 'error' ? 'bi-exclamation-circle' : 'bi-check2-circle'"></i>{{ t.text }}
        </div>
        <button type="button" class="btn-close me-2 m-auto" (click)="toast.dismiss(t.id)" aria-label="Cerrar"></button>
      </div>
    </div>
  }
</div>
